<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vocab</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1c1c28" />
<link rel="stylesheet" href="style.css?v=6" />
</head>
<body>

<main>
  <section id="view-review" class="view active">
    <div class="review-header">
      <span id="review-count"></span>
    </div>
    <div id="review-empty" style="display:none;">
      <p>All caught up. Nothing due right now.</p>
      <button id="btn-practice">Practice anyway</button>
    </div>
    <div id="flashcard">
      <div class="card-category" id="card-category"></div>
      <div class="card-word" id="card-word"></div>
      <div class="card-back" id="card-back"></div>
      <div class="card-hint" id="card-hint">tap to reveal</div>
    </div>
    <div id="review-controls" class="review-controls">
      <button id="btn-again" class="grade-btn grade-again">Didn't know</button>
      <button id="btn-good" class="grade-btn grade-good">Knew it</button>
    </div>
  </section>

  <section id="view-add" class="view">
    <h2>Add a word</h2>
    <form id="quick-add-form">
      <input type="text" id="quick-add-input" placeholder="Type a word..." autocomplete="off" />
      <button type="submit">Add</button>
    </form>

    <h3>Needs details (<span id="needs-details-count">0</span>)</h3>

    <div id="claude-bridge">
      <button id="btn-fill-all" class="bridge-btn bridge-btn-primary" style="display:none;">Fill all with Claude</button>
      <div class="bridge-steps">
        <button id="btn-copy-prompt" class="bridge-btn">1 · Copy prompt</button>
        <button id="btn-toggle-paste" class="bridge-btn">2 · Paste result</button>
      </div>
      <div id="bridge-hint">Paste the prompt into Claude, then bring its answer back here.</div>
      <button id="btn-toggle-key" class="key-link">API key settings</button>
      <div id="key-area" style="display:none;">
        <input type="password" id="key-input" placeholder="sk-ant-..." autocomplete="off" />
        <select id="model-select">
          <option value="claude-opus-4-8">Opus — best quality (~$0.008/card)</option>
          <option value="claude-sonnet-5">Sonnet — balanced (~$0.005/card)</option>
          <option value="claude-haiku-4-5">Haiku — cheapest (~$0.0017/card)</option>
        </select>
        <div class="key-actions">
          <button id="btn-save-key" class="bridge-btn bridge-btn-primary">Save</button>
          <button id="btn-clear-key" class="bridge-btn">Remove key</button>
        </div>
        <div id="key-status"></div>
        <div class="key-note">Stored only on this device, never in the app's code. Revoke anytime at console.anthropic.com.</div>
      </div>
      <div id="paste-area" style="display:none;">
        <textarea id="paste-input" placeholder="Paste Claude's JSON answer here..." rows="5"></textarea>
        <div class="paste-actions">
          <button id="btn-apply-paste" class="bridge-btn bridge-btn-primary">Fill cards</button>
          <span id="paste-status"></span>
        </div>
      </div>
    </div>

    <div id="needs-details-list"></div>
  </section>

  <section id="view-browse" class="view">
    <div class="browse-toolbar">
      <input type="text" id="browse-search" placeholder="Search..." />
      <select id="browse-filter">
        <option value="all">all</option>
      </select>
    </div>
    <div id="browse-count"></div>
    <div id="browse-list"></div>
  </section>
</main>

<nav id="tab-bar">
  <button class="tab-btn active" data-view="review">Review</button>
  <button class="tab-btn" data-view="add">Add</button>
  <button class="tab-btn" data-view="browse">Browse</button>
</nav>

<datalist id="group-datalist"></datalist>

<script src="seed.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
